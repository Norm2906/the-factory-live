<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE FACTORY LIVE</title><style>*{box-sizing:border-box}html{scroll-snap-type:y mandatory;scroll-behavior:smooth}body{margin:0;background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif}.top{position:fixed;z-index:4;top:0;left:0;right:0;padding:24px 5vw;font-size:19px;font-weight:900;letter-spacing:-.04em;background:linear-gradient(#0009,transparent)}section{height:100svh;min-height:480px;scroll-snap-align:start;display:flex;align-items:end;position:relative;background:linear-gradient(135deg,#171717,#25201d 45%,#080808);overflow:hidden}section:nth-child(3n+2){background:linear-gradient(130deg,#0d0e10,#282b31 60%,#080808)}section:nth-child(3n){background:linear-gradient(130deg,#17110e,#34271e 60%,#080808)}section:before{content:"";position:absolute;inset:0;background-image:var(--photo);background-size:cover;background-position:center;opacity:.9}section:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 20%,#000d)}article{position:relative;z-index:2;padding:0 8vw 13vh;max-width:1300px}small{display:block;font-size:clamp(13px,1.3vw,18px);font-weight:800;letter-spacing:.18em;margin-bottom:20px}h1{font-size:clamp(45px,8vw,120px);letter-spacing:-.055em;line-height:.94;margin:0;font-weight:900;max-width:1100px}p{font-size:clamp(23px,2.8vw,40px);font-weight:750;line-height:1.2;max-width:960px;text-shadow:0 2px 20px #000;margin:28px 0 0}.ctrl{position:fixed;right:3vw;bottom:25px;z-index:5;display:flex;gap:8px}.ctrl button{cursor:pointer;background:#171717bb;border:1px solid #fff8;color:white;border-radius:24px;padding:10px 17px;font-size:16px}.num{position:fixed;bottom:30px;left:5vw;z-index:5;font-size:13px;letter-spacing:.16em}@media(max-width:650px){article{padding:0 9vw 15vh 6vw}h1{font-size:clamp(42px,12vw,72px)}p{font-size:clamp(23px,6vw,32px)}small{font-size:12px}.top{padding:20px 6vw}}</style><div class="top">THE FACTORY / LIVE</div><main id="main"></main><div class="num" id="num">01 / 10</div><div class="ctrl"><button onclick="move(-1)" aria-label="Anterior">↑</button><button onclick="move(1)" aria-label="Siguiente">↓</button></div><script>const slides=[["THE FACTORY / A WINDOW TO THE WORLD","THE FACTORY IS ALREADY ALIVE.","No inventamos el movimiento. Lo hacemos visible."],["LA IDEA","UN LUGAR. MIL HISTORIAS.","Moda · Música · Movimiento · Arte · Gastronomía"],["LA FACTORY LIVE","UNA CÁMARA AL MUNDO.","Cada día, algo que merece ser visto."],["FACTORY FREQUENCIES","THE SOUND OF THE FACTORY.","Sesiones musicales. Público real. Archivo permanente."],["THE UNFINISHED COLLECTION","FASHION IN PROGRESS.","La creación sucede frente a todos."],["OSX MOVEMENT","WHAT MOVES YOU?","El movimiento también tiene historias."],["FACTORY TAKEOVER","THE SPACE IS THE STAGE.","Artistas y creadores transforman la escena."],["FACTORY NONSTOP","TODAY AT THE FACTORY.","Una agenda viva. Distintos mundos. Una misma señal."],["SESSION ZERO","START SMALL. MAKE IT MATTER.","Una jornada. Tres experiencias. Muchas historias."],["THE INVITATION","DON’T JUST TELL STORIES. MAKE THEM HAPPEN.","THE FACTORY · A WINDOW TO THE WORLD"]];const main=document.getElementById('main');slides.forEach((s,i)=>{let e=document.createElement('section');e.id='s'+i;e.style.setProperty('--photo','url(images/scene_'+String(i+1).padStart(2,'0')+'.jpg)');e.innerHTML='<article><small>'+s[0]+'</small><h1>'+s[1]+'</h1><p>'+s[2]+'</p></article>';main.append(e)});let current=0;const all=[...document.querySelectorAll('section')];new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){current=all.indexOf(e.target);document.getElementById('num').textContent=String(current+1).padStart(2,'0')+' / 10'}}),{threshold:.55}).observe(all[0]);const ob=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){current=all.indexOf(e.target);document.getElementById('num').textContent=String(current+1).padStart(2,'0')+' / 10'}}),{threshold:.55});all.forEach(e=>ob.observe(e));function move(d){all[Math.max(0,Math.min(9,current+d))].scrollIntoView({behavior:'smooth'})}document.addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight','PageDown'].includes(e.key))move(1);if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key))move(-1)})</script></html>
